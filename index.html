<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Event Passport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner Library (Camera Feed) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- jsQR Library (High-accuracy static image decoder) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body {
      background-image: url('./Background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* FORCED CONTRAST FIXES FOR HTML5-QRCODE INJECTED ELEMENTS */
    #reader {
      background-color: #0f172a !important;
      border: none !important;
    }
    #reader *, 
    #reader span, 
    #reader div, 
    #reader p {
      color: #f8fafc !important;
    }
    #reader select {
      background-color: #1e293b !important;
      color: #ffffff !important;
      border: 1px solid #334155 !important;
      border-radius: 0.75rem !important;
      padding: 0.5rem 0.75rem !important;
      font-size: 0.85rem !important;
      margin-bottom: 0.5rem !important;
      outline: none !important;
      width: 100% !important;
      max-width: 280px !important;
    }
    #reader select option {
      background-color: #0f172a !important;
      color: #ffffff !important;
    }
    #reader button {
      background-color: #1e40af !important;
      color: #ffffff !important;
      border-radius: 0.75rem !important;
      padding: 0.5rem 1rem !important;
      font-size: 0.75rem !important;
      font-weight: 700 !important;
      border: none !important;
      margin: 0.25rem !important;
      cursor: pointer !important;
      transition: background-color 0.2s !important;
    }
    #reader button:hover {
      background-color: #1d4ed8 !important;
    }
    #reader a {
      color: #60a5fa !important;
      text-decoration: underline !important;
      font-weight: 600 !important;
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- Floating Toast Notification -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-sm px-4 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-4">
    <div id="toast-body" class="bg-blue-950 text-white text-xs font-semibold p-3.5 rounded-2xl shadow-2xl border border-blue-800/50 flex flex-col gap-1 pointer-events-auto">
      <div id="toast-title" class="font-bold text-sm flex items-center gap-1.5"></div>
      <div id="toast-message" class="text-blue-200 text-[11px] leading-tight break-all"></div>
    </div>
  </div>

  <!-- Main Passport Card -->
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 space-y-5 border border-gray-100 relative overflow-hidden my-4">

    <!-- Event Banner / Header -->
    <div class="flex flex-col items-center justify-center text-center space-y-2 pt-1">
      <img 
        src="./BCYF 2026 Email Banner (1).png" 
        alt="BCYF 2026 Event Banner" 
        class="w-full max-h-32 object-contain rounded-2xl shadow-sm mb-1"
        onerror="this.style.display='none'"
      >
      <h1 class="text-2xl font-black text-blue-950 tracking-tight">
        Digital Passport
      </h1>
      
      <div class="flex items-center gap-2 flex-wrap justify-center">
        <span id="user-display" class="text-xs font-bold text-blue-900 bg-blue-50 border border-blue-100 py-1 px-3 rounded-full shadow-sm">
          User: Guest
        </span>
        <span id="last-scanned-badge" class="hidden text-xs font-black text-emerald-800 bg-emerald-100 border border-emerald-200 py-1 px-3 rounded-full shadow-sm">
          Last Scanned: None
        </span>
      </div>
    </div>
    
    <!-- Quest Path Progress Section -->
    <div class="space-y-3 bg-slate-50 p-4 rounded-3xl border border-slate-100">
      <div class="flex justify-between items-center text-xs font-bold text-blue-900 uppercase tracking-wider">
        <span>Quest Path</span>
        <span id="progress-text" class="text-blue-950 font-extrabold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full">0 / 20</span>
      </div>
      
      <!-- Horizontal Scrollable Node Path -->
      <div id="duo-path-container" class="relative py-2 overflow-x-auto no-scrollbar scroll-smooth">
        <div id="duo-path" class="flex items-center gap-3 min-w-max px-2">
          <!-- Dynamic nodes generated here -->
        </div>
      </div>
    </div>

    <!-- Single Unified Scan Button -->
    <div>
      <button onclick="openScanner()" class="w-full py-4 bg-blue-900 hover:bg-blue-950 active:scale-[0.98] text-white font-bold rounded-2xl shadow-lg shadow-blue-900/25 flex items-center justify-center gap-2.5 transition-all text-sm tracking-wide">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
        Scan QR Code
      </button>
    </div>

    <!-- Sticker Album Collection Grid -->
    <div>
      <div class="flex items-center justify-between mb-2 px-1">
        <p class="text-xs font-bold text-blue-900 uppercase tracking-wider">Passport Collection</p>
        <span class="text-[10px] text-gray-500 font-medium">Scan any booth to collect</span>
      </div>
      
      <div id="album-container" class="bg-slate-50 p-3.5 rounded-3xl border border-slate-100">
        <!-- 4 Column Sticker Grid -->
        <div id="sticker-grid" class="grid grid-cols-4 gap-2.5"></div>
      </div>
    </div>

    <!-- Sponsors Section -->
    <div class="border-t border-gray-100 pt-4 text-center space-y-2">
      <p class="text-[10px] font-bold text-blue-900 uppercase tracking-widest">Organized & Sponsored By</p>
      <div class="flex items-center justify-center gap-3 flex-wrap opacity-75">
        <img src="https://via.placeholder.com/80x30?text=Sponsor+1" alt="Sponsor 1" class="h-7 object-contain">
        <img src="https://via.placeholder.com/80x30?text=Sponsor+2" alt="Sponsor 2" class="h-7 object-contain">
        <img src="https://via.placeholder.com/80x30?text=Partner+1" alt="Partner 1" class="h-7 object-contain">
      </div>
    </div>

    <!-- Reset Option -->
    <div class="text-center pt-1">
      <button onclick="resetPassport()" class="text-[11px] text-gray-400 hover:text-red-500 underline transition-colors">
        Reset Passport & Clear Saved Data
      </button>
    </div>

  </div>

  <!-- Camera Scanner Modal -->
  <div id="scanner-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex-col items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-5 w-full max-w-sm text-center space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-blue-950">Scan Booth QR Code</h3>
        <button onclick="closeScanner()" class="text-gray-400 hover:text-gray-600 font-bold text-lg px-2">&times;</button>
      </div>
      
      <!-- Camera Viewport -->
      <div id="reader" class="w-full overflow-hidden rounded-2xl bg-slate-900 min-h-[260px] flex flex-col items-center justify-center"></div>
      
      <!-- Modal Footer Options -->
      <div class="flex items-center justify-between pt-1 text-xs px-1">
        <label for="modal-file-input" class="text-blue-900 hover:text-blue-950 font-bold underline cursor-pointer flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          Upload Photo Instead
        </label>
        <input type="file" id="modal-file-input" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
        
        <button onclick="closeScanner()" class="bg-slate-100 text-slate-700 font-bold px-3.5 py-1.5 rounded-xl hover:bg-slate-200 transition-colors">
          Close
        </button>
      </div>
    </div>
  </div>

  <script>
    const TOTAL = 20;
    let html5QrCode = null;
    let stamps = [];
    let lastScannedBooth = null;

    function standardizeBoothId(input) {
      if (!input) return null;
      const raw = String(input).trim().toUpperCase();

      for (let i = 1; i <= TOTAL; i++) {
        const paddedNum = String(i).padStart(2, '0');
        
        if (
          raw.includes(`BOOTH=B${paddedNum}`) ||
          raw.includes(`BOOTH=${paddedNum}`)  ||
          raw.includes(`BOOTH=${i}&`)         ||
          raw.endsWith(`BOOTH=${i}`)          ||
          raw === `B${paddedNum}`             ||
          raw === `BOOTH${paddedNum}`         ||
          raw === `${i}`
        ) {
          return `B${paddedNum}`;
        }
      }

      return null;
    }

    function showToast(title, message, isSuccess = true) {
      const container = document.getElementById("toast-container");
      const titleEl = document.getElementById("toast-title");
      const messageEl = document.getElementById("toast-message");
      const bodyEl = document.getElementById("toast-body");

      if (!container || !titleEl || !messageEl || !bodyEl) return;

      titleEl.innerHTML = isSuccess ? `🎉 ${title}` : `⚠️ ${title}`;
      messageEl.innerText = message;

      bodyEl.className = isSuccess 
        ? "bg-emerald-950 text-white text-xs font-semibold p-3.5 rounded-2xl shadow-2xl border border-emerald-800/60 flex flex-col gap-1 pointer-events-auto"
        : "bg-amber-950 text-white text-xs font-semibold p-3.5 rounded-2xl shadow-2xl border border-amber-800/60 flex flex-col gap-1 pointer-events-auto";

      container.classList.remove("opacity-0", "-translate-y-4", "pointer-events-none");
      container.classList.add("opacity-100", "translate-y-0");

      setTimeout(() => {
        container.classList.remove("opacity-100", "translate-y-0");
        container.classList.add("opacity-0", "-translate-y-4", "pointer-events-none");
      }, 4000);
    }

    function getSavedStamps() {
      try {
        const raw = JSON.parse(localStorage.getItem("passport_stamps") || "[]");
        const cleaned = raw.map(s => standardizeBoothId(s)).filter(Boolean);
        return [...new Set(cleaned)];
      } catch (e) {
        return [];
      }
    }

    function addStamp(rawInput, source = "scanner") {
      const formatted = standardizeBoothId(rawInput);

      if (!formatted) {
        showToast(
          "Invalid QR Code", 
          `Could not detect a valid booth (B01-B20).\nScanned content: "${rawInput}"`, 
          false
        );
        return;
      }

      lastScannedBooth = formatted;

      if (stamps.includes(formatted)) {
        showToast(
          `Already Collected!`, 
          `You have already unlocked ${formatted}.`, 
          false
        );
      } else {
        stamps.push(formatted);
        localStorage.setItem("passport_stamps", JSON.stringify(stamps));
        showToast(
          `Unlocked ${formatted}!`, 
          `Successfully registered stamp for ${formatted}.`, 
          true
        );
      }

      render(formatted);
    }

    function render(highlightBoothId = null) {
      stamps = getSavedStamps();
      const count = stamps.length;

      const progressText = document.getElementById("progress-text");
      if (progressText) progressText.innerText = `${count} / ${TOTAL} Stamps`;

      const lastBadge = document.getElementById("last-scanned-badge");
      if (lastBadge) {
        if (lastScannedBooth) {
          lastBadge.innerText = `Last Scanned: ${lastScannedBooth}`;
          lastBadge.classList.remove("hidden");
        } else {
          lastBadge.classList.add("hidden");
        }
      }

      let nextTargetNum = TOTAL + 1;
      for (let i = 1; i <= TOTAL; i++) {
        const bId = `B${String(i).padStart(2, '0')}`;
        if (!stamps.includes(bId)) {
          nextTargetNum = i;
          break;
        }
      }

      // 1. Render Quest Path Nodes
      const duoPath = document.getElementById("duo-path");
      if (duoPath) {
        duoPath.innerHTML = "";
        for (let step = 1; step <= TOTAL; step++) {
          const stepBoothId = `B${String(step).padStart(2, '0')}`;
          const isUnlocked = stamps.includes(stepBoothId);
          const isNextTarget = !isUnlocked && step === nextTargetNum;
          const isJustScanned = stepBoothId === highlightBoothId;

          const stepEl = document.createElement("div");
          stepEl.id = `node-${stepBoothId}`;
          stepEl.className = "flex items-center gap-3";

          if (isUnlocked) {
            stepEl.innerHTML = `
              <div class="flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-gradient-to-b from-emerald-400 to-teal-500 text-white flex items-center justify-center font-black text-xs shadow-md shadow-emerald-200 border-2 border-white transform ${isJustScanned ? 'scale-125 ring-4 ring-emerald-300' : 'scale-100'} transition-all">
                  ✓
                </div>
                <span class="text-[9px] font-black text-emerald-600 mt-1">${stepBoothId}</span>
              </div>
            `;
          } else if (isNextTarget) {
            stepEl.innerHTML = `
              <div class="flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-black text-xs shadow-md shadow-blue-300 border-2 border-blue-200 animate-bounce">
                  ${step}
                </div>
                <span class="text-[9px] font-black text-blue-600 mt-1">NEXT</span>
              </div>
            `;
          } else {
            stepEl.innerHTML = `
              <div class="flex flex-col items-center opacity-40">
                <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-xs border border-slate-300">
                  ${step}
                </div>
                <span class="text-[9px] font-semibold text-slate-400 mt-1">${stepBoothId}</span>
              </div>
            `;
          }

          if (step < TOTAL) {
            const line = document.createElement("div");
            line.className = `h-1 w-5 rounded-full ${isUnlocked ? 'bg-emerald-400' : 'bg-slate-200'}`;
            stepEl.appendChild(line);
          }

          duoPath.appendChild(stepEl);
        }
      }

      // 2. Render Passport Collection Album Grid
      const grid = document.getElementById("sticker-grid");
      if (grid) {
        grid.innerHTML = "";
        for (let i = 1; i <= TOTAL; i++) {
          const boothId = `B${String(i).padStart(2, '0')}`;
          const isStamped = stamps.includes(boothId);
          const isJustScanned = boothId === highlightBoothId;

          const slot = document.createElement("div");
          slot.id = `grid-${boothId}`;
          slot.className = "flex flex-col items-center justify-center";

          if (isStamped) {
            slot.innerHTML = `
              <div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-500 text-white flex flex-col items-center justify-center shadow-md shadow-emerald-100 border border-emerald-300 transform ${isJustScanned ? 'ring-4 ring-emerald-400 scale-105' : ''} transition-all">
                <span class="text-[8px] font-extrabold uppercase tracking-widest text-emerald-100">STAMPED</span>
                <span class="text-xs font-black tracking-tight">${boothId}</span>
              </div>
            `;
          } else {
            slot.innerHTML = `
              <div class="w-full aspect-square rounded-2xl bg-white text-slate-300 flex flex-col items-center justify-center border-2 border-dashed border-slate-200 shadow-sm">
                <span class="text-[8px] font-bold uppercase tracking-wider text-slate-400">BOOTH</span>
                <span class="text-xs font-black text-slate-400">${boothId}</span>
              </div>
            `;
          }

          grid.appendChild(slot);
        }
      }

      const targetFocusId = highlightBoothId || `B${String(nextTargetNum <= TOTAL ? nextTargetNum : 1).padStart(2, '0')}`;
      setTimeout(() => {
        const targetNode = document.getElementById(`node-${targetFocusId}`);
        const container = document.getElementById("duo-path-container");
        if (targetNode && container) {
          const scrollLeft = targetNode.offsetLeft - (container.clientWidth / 2) + (targetNode.clientWidth / 2);
          container.scrollTo({ left: scrollLeft, behavior: 'smooth' });
        }
      }, 100);
    }

    function initPassport() {
      let username = localStorage.getItem("passport_username");
      if (!username) {
        username = prompt("Welcome! Please enter your Username to start your passport:");
        if (username && username.trim() !== "") {
          username = username.trim();
          localStorage.setItem("passport_username", username);
        }
      }
      const userDisplay = document.getElementById("user-display");
      if (userDisplay) {
        userDisplay.innerText = username ? `User: ${username}` : "User: Guest";
      }

      const fullUrl = window.location.href;
      const urlBooth = standardizeBoothId(fullUrl);

      if (urlBooth) {
        addStamp(fullUrl, "url");
        try {
          const cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, document.title, cleanUrl);
        } catch (e) {}
      } else {
        render();
      }
    }

    async function openScanner() {
      const modal = document.getElementById("scanner-modal");
      if (modal) {
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }

      if (html5QrCode) {
        try {
          await html5QrCode.stop();
        } catch (e) {}
      }

      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 15,
        qrbox: (viewfinderWidth, viewfinderHeight) => {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          return {
            width: Math.floor(minEdge * 0.75),
            height: Math.floor(minEdge * 0.75)
          };
        }
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
          config,
          onScanSuccess,
          onScanFailure
        );
      } catch (err) {
        try {
          await html5QrCode.start(
            { facingMode: "user" },
            config,
            onScanSuccess,
            onScanFailure
          );
        } catch (fallbackErr) {
          showToast("Camera Error", "Unable to start camera. Try uploading an image file instead.", false);
        }
      }
    }

    async function closeScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        try {
          await html5QrCode.stop();
        } catch (e) {}
      }
      const modal = document.getElementById("scanner-modal");
      if (modal) {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }
    }

    /**
     * Resizes high-res images (Adobe Express / Canva) to ~600px 
     * and decodes pixel data using jsQR for maximum reliability.
     */
    function decodeFileWithJsQR(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);

        img.onload = () => {
          // Normalize dimension to ~600px (sweet spot for jsQR)
          const MAX_DIM = 600;
          let w = img.width;
          let h = img.height;

          if (w > MAX_DIM || h > MAX_DIM) {
            if (w > h) {
              h = Math.round((h * MAX_DIM) / w);
              w = MAX_DIM;
            } else {
              w = Math.round((w * MAX_DIM) / h);
              h = MAX_DIM;
            }
          }

          const padding = 50; // White border padding
          const canvas = document.createElement("canvas");
          canvas.width = w + (padding * 2);
          canvas.height = h + (padding * 2);

          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, padding, padding, w, h);

          URL.revokeObjectURL(url);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          
          // Try standard detection
          let code = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "dontInvert"
          });

          // Fallback to inverted detection
          if (!code || !code.data) {
            code = jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: "attemptBoth"
            });
          }

          if (code && code.data) {
            resolve(code.data);
          } else {
            reject(new Error("jsQR could not find a valid QR code pattern."));
          }
        };

        img.onerror = (e) => {
          URL.revokeObjectURL(url);
          reject(e);
        };

        img.src = url;
      });
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      await closeScanner();

      try {
        // Attempt 1: Fast & Resilient Canvas-based jsQR engine
        const decodedText = await decodeFileWithJsQR(file);
        addStamp(decodedText, "upload");
      } catch (err1) {
        // Attempt 2: Fallback to html5QrCode library scan
        try {
          if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
          }
          const decodedText = await html5QrCode.scanFile(file, false);
          addStamp(decodedText, "upload");
        } catch (err2) {
          showToast(
            "QR Code Not Found",
            "Could not detect a clear QR code in this image. Please try uploading a direct screenshot or clearer photo.",
            false
          );
        }
      } finally {
        event.target.value = "";
      }
    }

    function onScanSuccess(decodedText) {
      closeScanner();
      addStamp(decodedText, "camera");
    }

    function onScanFailure(error) {
      // Ignored for live video feed to avoid spam
    }

    function resetPassport() {
      if (confirm("Are you sure you want to clear all collected stamps and reset your passport data?")) {
        localStorage.clear();
        stamps = [];
        lastScannedBooth = null;
        location.reload();
      }
    }

    document.addEventListener("DOMContentLoaded", initPassport);
  </script>
</body>
</html>
