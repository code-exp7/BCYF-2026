<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Event Passport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background-image: url('./Background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- Main Passport White Card -->
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 space-y-6 border border-gray-100 relative overflow-hidden my-6">

    <!-- Event Banner / Logo Header -->
    <div class="flex flex-col items-center justify-center text-center space-y-2 pt-2">
      <img 
        src="./BCYF 2026 Email Banner (1).png" 
        alt="BCYF 2026 Event Banner" 
        class="w-full max-h-36 object-contain rounded-2xl shadow-sm mb-1"
      >
      <h1 class="text-2xl font-black text-blue-950 tracking-tight">
        Digital Passport
      </h1>
      <p id="user-display" class="text-xs font-semibold text-blue-900 bg-blue-50 border border-blue-100 py-1 px-3.5 rounded-full inline-block shadow-sm"></p>
    </div>
    
    <!-- Duolingo-Style Dynamic Path Progress Bar -->
    <div class="space-y-3 bg-slate-50 p-4 rounded-3xl border border-slate-100">
      <div class="flex justify-between items-center text-xs font-bold text-blue-900 uppercase tracking-wider">
        <span>Quest Progress</span>
        <span id="progress-text" class="text-blue-950 font-extrabold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full">0 / 20</span>
      </div>
      
      <!-- Horizontal Scrollable Node Path -->
      <div class="relative py-2 overflow-x-auto no-scrollbar">
        <div id="duo-path" class="flex items-center gap-3 min-w-max px-2">
          <!-- Dynamic nodes generate here -->
        </div>
      </div>
    </div>

    <!-- Camera Scan Button -->
    <button onclick="openScanner()" class="w-full py-3.5 bg-blue-900 hover:bg-blue-950 text-white font-bold rounded-2xl shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2 active:scale-95 transition-all">
      Scan Booth QR Code
    </button>

    <!-- Sticker Album Collection Grid -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <p class="text-xs font-bold text-blue-900 uppercase tracking-wider">Passport Collection</p>
        <span class="text-[10px] text-gray-500 font-medium">Scan booth QR codes to unlock</span>
      </div>
      
      <div id="album-container" class="bg-slate-50 p-4 rounded-3xl border border-slate-100">
        <!-- 4 Column Sticker Album Grid -->
        <div id="sticker-grid" class="grid grid-cols-4 gap-3"></div>
      </div>
    </div>

    <!-- Sponsors & Partners Placeholder Section -->
    <div class="border-t border-gray-100 pt-5 text-center space-y-3">
      <p class="text-[11px] font-bold text-blue-900 uppercase tracking-widest">Organized & Sponsored By</p>
      <div class="flex items-center justify-center gap-4 flex-wrap opacity-80">
        <img src="https://via.placeholder.com/90x35?text=Sponsor+1" alt="Sponsor 1" class="h-8 object-contain">
        <img src="https://via.placeholder.com/90x35?text=Sponsor+2" alt="Sponsor 2" class="h-8 object-contain">
        <img src="https://via.placeholder.com/90x35?text=Partner+1" alt="Partner 1" class="h-8 object-contain">
      </div>
    </div>

    <!-- Reset Option -->
    <div class="text-center pt-1">
      <button onclick="resetPassport()" class="text-[11px] text-gray-400 hover:text-red-500 underline transition-colors">Change Username / Reset Passport</button>
    </div>

  </div>

  <!-- Camera Scanner Modal -->
  <div id="scanner-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex-col items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center space-y-4">
      <h3 class="text-lg font-bold text-blue-950">Scan Booth QR Code</h3>
      <div id="reader" class="w-full overflow-hidden rounded-2xl border-2 border-gray-200"></div>
      <button onclick="closeScanner()" class="w-full py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200">Cancel</button>
    </div>
  </div>

  <script>
    const TOTAL = 20;
    let html5QrcodeScanner = null;
    let stamps = [];

    function standardizeBoothId(input) {
      if (!input) return null;
      const clean = input.toUpperCase().trim();
      const match = clean.match(/B?(\d+)/);
      if (match) {
        const num = parseInt(match[1], 10);
        if (num >= 1 && num <= TOTAL) {
          return `B${String(num).padStart(2, '0')}`;
        }
      }
      return null;
    }

    function getSavedStamps() {
      const raw = JSON.parse(localStorage.getItem("passport_stamps") || "[]");
      return raw.map(s => standardizeBoothId(s)).filter(Boolean);
    }

    function addStamp(boothId) {
      const formatted = standardizeBoothId(boothId);
      if (formatted && !stamps.includes(formatted)) {
        stamps.push(formatted);
        localStorage.setItem("passport_stamps", JSON.stringify(stamps));
        alert(`Stamp Unlocked for Booth ${formatted}!`);
      }
      render();
    }

    function render() {
      stamps = getSavedStamps();
      const count = stamps.length;

      const progressText = document.getElementById("progress-text");
      if (progressText) progressText.innerText = `${count} / ${TOTAL} Stamps`;

      // 1. Render Duolingo Dynamic Progress Path
      const duoPath = document.getElementById("duo-path");
      if (duoPath) {
        duoPath.innerHTML = "";
        for (let step = 1; step <= TOTAL; step++) {
          const isUnlocked = step <= count;
          const isCurrentTarget = step === count + 1;
          const boothCollected = stamps[step - 1]; // Shows which booth filled this slot chronologically

          const stepEl = document.createElement("div");
          stepEl.className = "flex items-center gap-3";

          if (isUnlocked) {
            // Completed Node
            stepEl.innerHTML = `
              <div class="flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-gradient-to-b from-emerald-400 to-teal-500 text-white flex items-center justify-center font-black text-xs shadow-md shadow-emerald-200 border-2 border-white transform scale-110">
                  ✓
                </div>
                <span class="text-[9px] font-extrabold text-emerald-600 mt-1">${boothCollected}</span>
              </div>
            `;
          } else if (isCurrentTarget) {
            // Next Active Target (Pulsing Duolingo Style)
            stepEl.innerHTML = `
              <div class="flex flex-col items-center">
                <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-black text-xs shadow-md shadow-blue-300 border-2 border-blue-200 animate-bounce">
                  ${step}
                </div>
                <span class="text-[9px] font-bold text-blue-600 mt-1">NEXT</span>
              </div>
            `;
          } else {
            // Locked Future Node
            stepEl.innerHTML = `
              <div class="flex flex-col items-center opacity-40">
                <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-xs border border-gray-300">
                  ${step}
                </div>
                <span class="text-[9px] font-semibold text-gray-400 mt-1">LOCKED</span>
              </div>
            `;
          }

          // Add connecting track line between nodes
          if (step < TOTAL) {
            const line = document.createElement("div");
            line.className = `h-1 w-6 rounded-full ${step <= count ? 'bg-emerald-400' : 'bg-gray-200'}`;
            stepEl.appendChild(line);
          }

          duoPath.appendChild(stepEl);
        }
      }

      // 2. Render Album Grid
      const grid = document.getElementById("sticker-grid");
      if (!grid) return;
      grid.innerHTML = "";

      for (let i = 1; i <= TOTAL; i++) {
        const boothId = `B${String(i).padStart(2, '0')}`;
        const isStamped = stamps.includes(boothId);

        const slot = document.createElement("div");
        slot.className = "flex flex-col items-center justify-center";

        if (isStamped) {
          slot.innerHTML = `
            <div class="w-full aspect-square rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-500 text-white flex flex-col items-center justify-center shadow-md shadow-emerald-100 border border-emerald-300 transform scale-105 transition-all">
              <span class="text-[9px] font-extrabold uppercase tracking-widest text-emerald-100">STAMPED</span>
              <span class="text-sm font-black tracking-tight">${boothId}</span>
            </div>
          `;
        } else {
          slot.innerHTML = `
            <div class="w-full aspect-square rounded-2xl bg-white text-gray-300 flex flex-col items-center justify-center border-2 border-dashed border-gray-200 shadow-sm transition-all">
              <span class="text-[9px] font-bold uppercase tracking-wider text-gray-400">BOOTH</span>
              <span class="text-xs font-black text-gray-400">${boothId}</span>
            </div>
          `;
        }

        grid.appendChild(slot);
      }
    }

    function initPassport() {
      let username = localStorage.getItem("passport_username");
      if (!username) {
        username = prompt("Welcome! Please enter your Username to start your passport:");
        if (username && username.trim() !== "") {
          username = username.trim();
          localStorage.setItem("passport_username", username);
        }
      }
      const userDisplay = document.getElementById("user-display");
      if (userDisplay) {
        userDisplay.innerText = username ? `User: ${username}` : "Not logged in";
      }

      stamps = getSavedStamps();

      const urlParams = new URLSearchParams(window.location.search);
      const scannedBooth = urlParams.get('booth');
      if (scannedBooth) {
        addStamp(scannedBooth);
        window.history.replaceState({}, document.title, window.location.pathname);
      } else {
        render();
      }
    }

    function openScanner() {
      const modal = document.getElementById("scanner-modal");
      if (modal) {
        modal.classList.remove("hidden");
        modal.classList.add("flex");
      }

      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } });
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function closeScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(error => console.error(error));
      }
      const modal = document.getElementById("scanner-modal");
      if (modal) {
        modal.classList.add("hidden");
        modal.classList.remove("flex");
      }
    }

    function onScanSuccess(decodedText) {
      closeScanner();
      if (decodedText.includes("booth=")) {
        const match = decodedText.match(/booth=([^&]+)/);
        if (match) addStamp(match[1]);
      } else {
        addStamp(decodedText);
      }
    }

    function onScanFailure(error) {
      // Quiet fail while searching
    }

    function resetPassport() {
      if (confirm("Reset local stamp history and change username?")) {
        localStorage.clear();
        location.reload();
      }
    }

    document.addEventListener("DOMContentLoaded", initPassport);
  </script>
</body>
</html>
