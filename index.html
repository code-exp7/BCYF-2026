<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Event Passport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      background-image: url('./Background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

  <!-- Main Passport White Card -->
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 space-y-6 border border-gray-100 relative overflow-hidden my-6">

    <!-- Event Banner / Logo Header -->
    <div class="flex flex-col items-center justify-center text-center space-y-2 pt-2">
      <img 
        src="./BCYF 2026 Email Banner (1).png" 
        alt="BCYF 2026 Event Banner" 
        class="w-full max-h-36 object-contain rounded-2xl shadow-sm mb-1"
      >
      <h1 class="text-2xl font-black text-blue-950 tracking-tight">
        Digital Passport
      </h1>
      <p id="user-display" class="text-xs font-semibold text-blue-900 bg-blue-50 border border-blue-100 py-1 px-3.5 rounded-full inline-block shadow-sm"></p>
    </div>
    
    <!-- Progress Bar Section -->
    <div class="space-y-2 bg-slate-50 p-3.5 rounded-2xl border border-slate-100">
      <div class="flex justify-between text-xs font-bold text-blue-900 uppercase tracking-wider">
        <span>Stamp Progress</span>
        <span id="progress-text" class="text-blue-950 font-extrabold">0 / 20 Stamps</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-3.5 overflow-hidden p-0.5 border border-gray-200/60">
        <div id="progress-bar" class="bg-gradient-to-r from-emerald-400 to-teal-500 h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
      </div>
    </div>

    <!-- Camera Scan Button -->
    <button onclick="openScanner()" class="w-full py-3.5 bg-blue-900 hover:bg-blue-950 text-white font-bold rounded-2xl shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2 active:scale-95 transition-all">
      Scan Booth QR Code
    </button>

    <!-- Interactive Roadmap Trail -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <p class="text-xs font-bold text-blue-900 uppercase tracking-wider">Booths to Visit</p>
        <span class="text-[10px] text-gray-500 font-medium">Scan booth QR codes to unlock</span>
      </div>
      
      <div id="roadmap-container" class="relative w-full py-2 bg-slate-50 p-4 rounded-3xl border border-slate-100"></div>
    </div>

    <!-- Sponsors & Partners Placeholder Section -->
    <div class="border-t border-gray-100 pt-5 text-center space-y-3">
      <p class="text-[11px] font-bold text-blue-900 uppercase tracking-widest">Organized & Sponsored By</p>
      <div class="flex items-center justify-center gap-4 flex-wrap opacity-80">
        <img src="https://via.placeholder.com/90x35?text=Sponsor+1" alt="Sponsor 1" class="h-8 object-contain">
        <img src="https://via.placeholder.com/90x35?text=Sponsor+2" alt="Sponsor 2" class="h-8 object-contain">
        <img src="https://via.placeholder.com/90x35?text=Partner+1" alt="Partner 1" class="h-8 object-contain">
      </div>
    </div>

    <!-- Reset Option -->
    <div class="text-center pt-1">
      <button onclick="resetPassport()" class="text-[11px] text-gray-400 hover:text-red-500 underline transition-colors">Change Email / Reset Passport</button>
    </div>

  </div>

  <!-- Camera Scanner Modal -->
  <div id="scanner-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex-col items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center space-y-4">
      <h3 class="text-lg font-bold text-blue-950">Scan Booth QR Code</h3>
      <div id="reader" class="w-full overflow-hidden rounded-2xl border-2 border-gray-200"></div>
      <button onclick="closeScanner()" class="w-full py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200">Cancel</button>
    </div>
  </div>

  <script>
    const TOTAL = 20;
    let html5QrcodeScanner = null;

    // 1. Retrieve or prompt for attendee email
    let email = localStorage.getItem("passport_email");
    if (!email) {
      email = prompt("Welcome! Please enter your email address to start your passport:");
      if (email && email.trim() !== "") {
        email = email.trim();
        localStorage.setItem("passport_email", email);
      }
    }
    document.getElementById("user-display").innerText = email ? `Attendee: ${email}` : "Not logged in";

    // 2. Load saved stamps and standardize formatting
    function getSavedStamps() {
      const raw = JSON.parse(localStorage.getItem("passport_stamps") || "[]");
      return raw.map(s => standardizeBoothId(s)).filter(Boolean);
    }

    function standardizeBoothId(input) {
      if (!input) return null;
      const clean = input.toUpperCase().trim();
      const match = clean.match(/B?(\d+)/);
      if (match) {
        const num = parseInt(match[1], 10);
        if (num >= 1 && num <= TOTAL) {
          return `B${String(num).padStart(2, '0')}`;
        }
      }
      return null;
    }

    let stamps = getSavedStamps();

    // 3. Process URL parameter scans
    const urlParams = new URLSearchParams(window.location.search);
    const scannedBooth = urlParams.get('booth');
    if (scannedBooth) {
      addStamp(scannedBooth);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Helper to add stamp
    function addStamp(boothId) {
      const formatted = standardizeBoothId(boothId);
      if (formatted && !stamps.includes(formatted)) {
        stamps.push(formatted);
        localStorage.setItem("passport_stamps", JSON.stringify(stamps));
        alert(`Stamp Unlocked for Booth ${formatted}!`);
      }
      render();
    }

    // 4. Render Roadmap Trail
    function render() {
      stamps = getSavedStamps();
      const count = stamps.length;
      const percent = Math.round((count / TOTAL) * 100);
      document.getElementById("progress-bar").style.width = percent + "%";
      document.getElementById("progress-text").innerText = `${count} / ${TOTAL} (${percent}%)`;

      const container = document.getElementById("roadmap-container");
      container.innerHTML = "";

      const cols = 4;
      const rows = Math.ceil(TOTAL / cols);
      
      let maxStampedIndex = 0;
      for (let i = 1; i <= TOTAL; i++) {
        const id = `B${String(i).padStart(2, '0')}`;
        if (stamps.includes(id)) {
          maxStampedIndex = Math.max(maxStampedIndex, i);
        }
      }

      let gridHtml = `<div class="grid grid-cols-4 gap-y-6 gap-x-2 relative z-10">`;

      for (let r = 0; r < rows; r++) {
        const isEvenRow = r % 2 === 0;
        let rowNodes = [];

        for (let c = 0; c < cols; c++) {
          const index = r * cols + c + 1;
          if (index <= TOTAL) {
            rowNodes.push(index);
          }
        }

        if (!isEvenRow) {
          rowNodes.reverse();
        }

        rowNodes.forEach(nodeNum => {
          const boothId = `B${String(nodeNum).padStart(2, '0')}`;
          const isStamped = stamps.includes(boothId);

          gridHtml += `
            <div class="flex flex-col items-center justify-center relative">
              <div class="w-12 h-12 rounded-2xl flex flex-col items-center justify-center font-bold text-xs transition-all duration-300 border ${
                isStamped
                  ? 'bg-gradient-to-b from-emerald-400 to-teal-500 text-white border-emerald-300 shadow-md shadow-emerald-100 scale-105'
                  : 'bg-white text-gray-400 border-gray-200 shadow-sm'
              }">
                <span class="text-[9px] opacity-75 uppercase tracking-tighter">${isStamped ? 'DONE' : 'BOOTH'}</span>
                <span class="text-xs font-black">${boothId}</span>
              </div>
            </div>
          `;
        });
      }

      gridHtml += `</div>`;
      container.innerHTML = gridHtml;
    }

    // 5. In-App Camera Scanner Functions
    function openScanner() {
      document.getElementById("scanner-modal").classList.remove("hidden");
      document.getElementById("scanner-modal").classList.add("flex");

      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 220, height: 220 } });
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function closeScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(error => console.error(error));
      }
      document.getElementById("scanner-modal").classList.add("hidden");
      document.getElementById("scanner-modal").classList.remove("flex");
    }

    function onScanSuccess(decodedText) {
      closeScanner();
      if (decodedText.includes("booth=")) {
        const match = decodedText.match(/booth=([^&]+)/);
        if (match) addStamp(match[1]);
      } else {
        addStamp(decodedText);
      }
    }

    function onScanFailure(error) {
      // Quiet fail searching
    }

    function resetPassport() {
      if (confirm("Reset local stamp history and change email?")) {
        localStorage.clear();
        location.reload();
      }
    }

    render();
  </script>
</body>
</html>
